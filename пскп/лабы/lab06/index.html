<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Belpost</title>
</head>
<body>
    <h1>Send mail</h1>
    <form action="/send" method="POST">

        <button type="submit">Send!! </button>
    </form>
</body>
</html>
